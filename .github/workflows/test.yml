name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sse-parity-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SSE_PARITY_PEERS: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: peers/node/package.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install peers
        run: |
          (cd peers/node && npm install)
          (cd peers/python && uv sync)

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: cl-repo install deps
        shell: bash
        run: ros -l scripts/ci-install.lisp -q

      - name: Test
        shell: bash
        run: ros -l scripts/ci-test.lisp -q
